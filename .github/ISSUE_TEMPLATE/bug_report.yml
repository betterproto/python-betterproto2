name: Bug Report
description: Report broken or incorrect behaviour
labels: ["bug"]

body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or steps that reproduce the issue.
      placeholder: |
        ```python
        # your code here
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the full traceback if applicable.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Paste the output of `protoc --version; python --version; pip show betterproto2` below.
      render: text
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
