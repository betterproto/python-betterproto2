name: Feature Request
description: Suggest a feature for this library
labels: ["enhancement"]

body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this feature solve? What is currently difficult or impossible?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: What would you like to see implemented? How would it work?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you have thought of.
    validations:
      required: false
